<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Harbor and Hive Connector promotional asset</title><desc id="d">Promotional card emphasizing controlled handoffs and exception visibility.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F7FA"/><stop offset="1" stop-color="#E6F3F2"/></linearGradient></defs><rect width="1200" height="675" rx="36" fill="url(#g)"/><rect x="0" y="0" width="1200" height="96" rx="36" fill="#102A43"/><rect x="0" y="72" width="1200" height="24" fill="#102A43"/><text x="64" y="60" fill="#fff" font-family="Arial,sans-serif" font-size="27" font-weight="700">HARBOR &amp; HIVE CONNECTOR™</text><text x="64" y="170" fill="#102A43" font-family="Arial,sans-serif" font-size="48" font-weight="700">Connect without losing control.</text><text x="64" y="220" fill="#52667A" font-family="Arial,sans-serif" font-size="22">Receive • validate • normalize • map • govern • route • trace</text><g transform="translate(64 292)"><rect x="0" y="0" width="328" height="235" rx="24" fill="#fff" stroke="#D9E2EC" stroke-width="2"/><text x="28" y="50" fill="#0F7C7B" font-family="Arial,sans-serif" font-size="18" font-weight="700">VISIBILITY</text><text x="28" y="95" fill="#102A43" font-family="Arial,sans-serif" font-size="29" font-weight="700">Know what moved.</text><text x="28" y="135" fill="#52667A" font-family="Arial,sans-serif" font-size="17">Source, validation, mapping,</text><text x="28" y="163" fill="#52667A" font-family="Arial,sans-serif" font-size="17">routing and lineage remain visible.</text><rect x="436" y="0" width="328" height="235" rx="24" fill="#fff" stroke="#D9E2EC" stroke-width="2"/><text x="464" y="50" fill="#D89B2B" font-family="Arial,sans-serif" font-size="18" font-weight="700">EXCEPTION CONTROL</text><text x="464" y="95" fill="#102A43" font-family="Arial,sans-serif" font-size="29" font-weight="700">Know what failed.</text><text x="464" y="135" fill="#52667A" font-family="Arial,sans-serif" font-size="17">Missing, invalid or unsupported</text><text x="464" y="163" fill="#52667A" font-family="Arial,sans-serif" font-size="17">records surface before handoff.</text><rect x="872" y="0" width="264" height="235" rx="24" fill="#102A43"/><text x="900" y="50" fill="#9FE2DF" font-family="Arial,sans-serif" font-size="18" font-weight="700">CONTROLLED HANDOFF</text><text x="900" y="95" fill="#fff" font-family="Arial,sans-serif" font-size="29" font-weight="700">Know where</text><text x="900" y="128" fill="#fff" font-family="Arial,sans-serif" font-size="29" font-weight="700">it went.</text><text x="900" y="170" fill="#D9E2EC" font-family="Arial,sans-serif" font-size="16">Route only to the</text><text x="900" y="194" fill="#D9E2EC" font-family="Arial,sans-serif" font-size="16">approved destination.</text></g><text x="64" y="618" fill="#7442B8" font-family="Arial,sans-serif" font-size="17" font-weight="700">AKUA SHULER • THE ARCHITECT OF TIME™ • PRODUCT / PILOT SHOWCASE</text></svg>