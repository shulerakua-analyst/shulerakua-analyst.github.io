<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
<title id="t">Harbor and Hive Connector governed connection path</title><desc id="d">A branded promotional flow showing connect, validate, normalize, govern, and route.</desc><rect width="1200" height="675" rx="36" fill="#102A43"/><circle cx="110" cy="102" r="50" fill="#163B5C" stroke="#D89B2B" stroke-width="5"/><text x="110" y="102" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="700">H&amp;H</text><text x="110" y="122" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="10" font-weight="700">CONNECTOR</text><text x="185" y="86" fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="700">HARBOR &amp; HIVE CONNECTOR™</text><text x="185" y="119" fill="#9FE2DF" font-family="Arial, sans-serif" font-size="18">Governed connections. Clean data. Controlled handoffs.</text><text x="70" y="220" fill="#fff" font-family="Arial, sans-serif" font-size="44" font-weight="700">Your integration should do more</text><text x="70" y="270" fill="#fff" font-family="Arial, sans-serif" font-size="44" font-weight="700">than move data.</text><text x="70" y="316" fill="#D9E2EC" font-family="Arial, sans-serif" font-size="21">It should show where data came from, what happened to it,</text><text x="70" y="348" fill="#D9E2EC" font-family="Arial, sans-serif" font-size="21">where it went, and what needs attention next.</text><g transform="translate(70 410)"><g fill="#fff" stroke="#D9E2EC" stroke-width="2"><rect x="0" y="0" width="190" height="110" rx="18"/><rect x="220" y="0" width="190" height="110" rx="18"/><rect x="440" y="0" width="190" height="110" rx="18"/><rect x="660" y="0" width="190" height="110" rx="18"/><rect x="880" y="0" width="190" height="110" rx="18"/></g><g fill="#102A43" font-family="Arial, sans-serif" text-anchor="middle"><text x="95" y="48" font-size="18" font-weight="700">CONNECT</text><text x="95" y="75" font-size="13">Source systems</text><text x="315" y="48" font-size="18" font-weight="700">VALIDATE</text><text x="315" y="75" font-size="13">Data rules</text><text x="535" y="48" font-size="18" font-weight="700">NORMALIZE</text><text x="535" y="75" font-size="13">Canonical data</text><text x="755" y="48" font-size="18" font-weight="700">GOVERN</text><text x="755" y="75" font-size="13">Controls + review</text><text x="975" y="48" font-size="18" font-weight="700">ROUTE</text><text x="975" y="75" font-size="13">Approved destination</text></g><g stroke="#D89B2B" stroke-width="5"><line x1="190" y1="55" x2="220" y2="55"/><line x1="410" y1="55" x2="440" y2="55"/><line x1="630" y1="55" x2="660" y2="55"/><line x1="850" y1="55" x2="880" y2="55"/></g></g><text x="70" y="615" fill="#D89B2B" font-family="Arial, sans-serif" font-size="18" font-weight="700">PORTFOLIO PRODUCT SHOWCASE • CLIENT PILOT PACKAGE</text></svg>